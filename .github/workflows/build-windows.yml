name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "portfolio_analyzer.py"
      - "requirements.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name PortfolioAnalyzer portfolio_analyzer.py

      - name: Zip executable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PortfolioAnalyzer.exe -DestinationPath dist/PortfolioAnalyzer-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioAnalyzer-windows
          path: dist/PortfolioAnalyzer-windows.zip

